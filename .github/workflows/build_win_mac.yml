# Build Windows + macOS in a SINGLE workflow and publish a GitHub Release when a
# version tag (v*) is pushed. A runner matrix builds all three targets in
# parallel: Windows x64 (windows-latest), macOS arm64 (macos-14-large), and
# macOS x64 (macos-13).
#
# Release assets (all published to the same GitHub Release on a v* tag):
#   - Windows: Transcription-Agent-<ver>.exe + latest.yml
#   - macOS:   Transcription-Agent-<ver>-<arch>.dmg +
#              Transcription-Agent-<ver>-<arch>.zip + latest-mac.yml
#
# The macOS build produces the `Transcription Agent.app` bundle, which is
# packaged into BOTH the .dmg (user-facing installer) and the .zip (the
# auto-update artifact — the .app compressed). A standalone .app is not
# published separately (it lives inside both archives).
#
# macOS is intentionally UNSIGNED and NOT notarized — no Apple Developer
# account, certificate, or secrets required. Consequences:
#   - Users bypass Gatekeeper once (right-click → Open, or System Settings →
#     Privacy & Security → "Open Anyway").
#   - macOS in-app auto-update is best-effort (electron-updater generally needs
#     a signed app); when it fails the app shows a "Download manually (macOS)"
#     link to the Release.
name: Build Win + Mac

on:
  workflow_dispatch: # manual trigger from GitHub UI
  push:
    tags: ["v*"] # auto-trigger on version tags

# contents: write is required to create/update GitHub Releases when publishing
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            electron_target: --win
            mac_extra: ""
          - name: mac-arm64
            os: macos-14-large # Apple Silicon — requires larger runners enabled
            electron_target: --mac --arm64
            mac_extra: --config.mac.notarize=false
          - name: mac-x64
            os: macos-13
            electron_target: --mac --x64
            mac_extra: --config.mac.notarize=false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          cd python-backend
          python -m venv venv
          if [[ "${{ runner.os }}" == "Windows" ]]; then source venv/Scripts/activate; else source venv/bin/activate; fi
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install faster-whisper
          pip install pyinstaller

      - name: Audit Python dependencies (pip-audit)
        shell: bash
        run: |
          cd python-backend
          if [[ "${{ runner.os }}" == "Windows" ]]; then source venv/Scripts/activate; else source venv/bin/activate; fi
          pip install pip-audit
          # --ignore-vuln whitelists the documented accepted-risk ML stack:
          #   torch 2.8.0 (pinned for pyannote/torchaudio compat — see win-crossover-unicode-fix.md),
          #   transformers 4.57.6 / lightning / chromadb (fixes need major bumps not yet compatible).
          pip-audit --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3624 \
            --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2025-203 --ignore-vuln PYSEC-2025-204 --ignore-vuln PYSEC-2025-206 \
            --ignore-vuln PYSEC-2026-139 --ignore-vuln PYSEC-2026-2286 --ignore-vuln CVE-2025-2999 --ignore-vuln CVE-2025-3001 \
            --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288 --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290

      - name: Build Python backend (host arch)
        shell: bash
        run: |
          cd python-backend
          if [[ "${{ runner.os }}" == "Windows" ]]; then source venv/Scripts/activate; else source venv/bin/activate; fi
          # --collect-all for lightning_fabric / pytorch_lightning / pyannote.audio bundles the
          # ML packages' DATA files (e.g. lightning_fabric/version.info) — without them,
          # `import pyannote.audio` crashes with FileNotFoundError (diarization unavailable).
          # chromadb: --collect-all bundles the importlib-resolved rust API impl
          # (chromadb.api.rust.RustBindingsAPI) + telemetry + the native chromadb_rust_bindings
          # extension, which a bare --hidden-import "chromadb" missed → "No module named
          # 'chromadb.api.rust'" on save-context in the packaged app.
          pyinstaller --onedir --name main --distpath ../dist-resources/python-backend --workpath build/pyinstaller --specpath build \
            --hidden-import "uvicorn" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.httptools_impl" \
            --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.wsproto_impl" \
            --hidden-import "uvicorn.middleware" --hidden-import "uvicorn.middleware.proxy_headers" \
            --hidden-import "fastapi" --hidden-import "fastapi.routing" --hidden-import "pydantic" --hidden-import "pydantic.json" \
            --hidden-import "multipart" --hidden-import "python_multipart" --hidden-import "soundfile" --hidden-import "numpy" \
            --hidden-import "torch" --hidden-import "torchaudio" --hidden-import "pyannote.audio" \
            --hidden-import "pyannote.audio.pipelines" --hidden-import "pyannote.audio.pipelines.speaker_diarization" \
            --collect-all "chromadb" \
            --collect-all "chromadb_rust_bindings" \
            --hidden-import "sentence_transformers" --hidden-import "dotenv" \
            --hidden-import "json" --hidden-import "threading" --hidden-import "warnings" --hidden-import "asyncio" \
            --hidden-import "os" --hidden-import "sys" --hidden-import "shutil" --hidden-import "glob" --hidden-import "uuid" \
            --hidden-import "datetime" --hidden-import "pathlib" --hidden-import "sqlite3" --hidden-import "hashlib" \
            --hidden-import "logging" --hidden-import "inspect" --hidden-import "contextlib" --hidden-import "collections" \
            --hidden-import "functools" --hidden-import "typing" \
            --hidden-import "email.mime.text" --hidden-import "email.mime.multipart" --hidden-import "email.mime.base" \
            --hidden-import "httpx" --hidden-import "anyio" --hidden-import "sniffio" \
            --hidden-import "faster_whisper" \
            --hidden-import "ctranslate2" \
            --hidden-import "starlette" --hidden-import "starlette.middleware" --hidden-import "starlette.middleware.cors" \
            --hidden-import "starlette.routing" --hidden-import "starlette.applications" --hidden-import "starlette.requests" \
            --hidden-import "starlette.responses" --hidden-import "starlette.datastructures" --hidden-import "multidict" \
            --collect-all "lightning_fabric" \
            --collect-all "pytorch_lightning" \
            --collect-all "pyannote.audio" \
            --collect-all "speechbrain" \
            main.py
          rm -rf build

      - name: Bundle ffmpeg for Windows (avoids end-user download)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-resources/ffmpeg
          curl -fsSL https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -o ffmpeg.zip
          unzip -o ffmpeg.zip
          cp ffmpeg-*-essentials_build/bin/ffmpeg.exe dist-resources/ffmpeg/ffmpeg.exe
          rm -rf ffmpeg-*-essentials_build ffmpeg.zip

      - name: Bundle ffmpeg for macOS (avoids end-user download)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-resources/ffmpeg
          brew install ffmpeg
          cp "$(command -v ffmpeg)" dist-resources/ffmpeg/ffmpeg

      - name: Build bridge-server & agent-runner deps
        run: |
          cd bridge-server && npm ci && cd ..
          cd agent-runner && npm ci && cd ..

      - name: Write version file
        run: bash scripts/write-version.sh
        shell: bash

      - name: Install electron & build (publish release on tag builds)
        shell: bash
        env:
          # The built-in GITHUB_TOKEN has contents: write (see permissions block),
          # which is enough for electron-builder to create the GitHub Release and
          # upload all platform assets on the same private repo.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm ci
          npm run build
          # macOS is unsigned by design — no Developer ID cert / notary secrets.
          if [[ "${{ matrix.name }}" == mac-* ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag build → create/update the GitHub Release and upload assets.
            npx electron-builder ${{ matrix.electron_target }} ${{ matrix.mac_extra }} --publish always
          else
            # Manual dispatch → build only (no release).
            npx electron-builder ${{ matrix.electron_target }} ${{ matrix.mac_extra }} --publish never
          fi

      - name: Audit npm production dependencies
        run: |
          cd electron && npm audit --omit=dev; cd ..
          cd agent-runner && npm audit --omit=dev; cd ..
          cd bridge-server && npm audit --omit=dev; cd ..
